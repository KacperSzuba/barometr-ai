name: Barometr AI CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Dolna granica z requires-python jest realnie testowana, a nie tylko deklarowana.
        python-version: ["3.11", "3.13"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up uv i Python ${{ matrix.python-version }}
      uses: astral-sh/setup-uv@v6
      with:
        enable-cache: true
        python-version: ${{ matrix.python-version }}

    # --frozen wywala się, gdy uv.lock rozjechał się z pyproject.toml — dzięki temu
    # nieaktualny lock nie prześlizgnie się przez CI.
    - name: Install dependencies
      run: uv sync --frozen --extra dev

    - name: Ruff lint
      run: uv run ruff check .

    - name: Ruff format check
      run: uv run ruff format --check .

    - name: Mypy strict
      run: uv run mypy

    - name: Cache modeli ONNX
      uses: actions/cache@v4
      with:
        path: ~/.cache/huggingface
        key: fastembed-${{ hashFiles('uv.lock') }}

    - name: Pytest + golden set
      run: uv run pytest -q

  security:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: astral-sh/setup-uv@v6
      with:
        enable-cache: true
        python-version: "3.13"
    - name: Install dependencies
      run: uv sync --frozen --extra dev
    # Audytujemy zawartość uv.lock, a nie środowiska. --no-emit-project pomija sam
    # pakiet barometr-ai, którego nie ma na PyPI — przy --strict pip-audit traktuje
    # taki nieodnaleziony pakiet jako błąd i wywala job.
    - name: Eksport zablokowanych wersji do audytu
      run: uv export --frozen --extra dev --no-emit-project --no-hashes --format requirements-txt -o requirements-audit.txt
    # --no-deps: eksport jest w pełni przypięty, nie ma czego rozwiązywać.
    - name: Skan zależności
      run: uv run pip-audit --strict --no-deps -r requirements-audit.txt

  image:
    runs-on: ubuntu-latest
    needs: [quality]
    steps:
    - uses: actions/checkout@v4
    - name: Build obrazu produkcyjnego
      run: docker build -t barometr-ai:${{ github.sha }} .
