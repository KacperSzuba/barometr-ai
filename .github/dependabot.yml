version: 2
updates:
  # Zależności Pythona — źródłem prawdy jest uv.lock, więc Dependabot ma konkretne
  # wersje do podbicia (przy samych widełkach ">=" nie miałby czego aktualizować).
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    labels: ["dependencies", "python"]
    groups:
      # Minor/patch lecą jednym zbiorczym PR-em; major osobno, bo wymaga przeglądu.
      python-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels: ["dependencies", "ci"]
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels: ["dependencies", "docker"]
