[project]
name = "barometr-ai"
version = "0.1.0"
description = "Bezstanowy serwis AI dla platformy Barometr (NLP, embeddingi, streszczenia, klastrowanie)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "fastembed>=0.4.0",
    "numpy>=1.26.0",
    "anthropic>=1.0.0",
    "opentelemetry-api>=1.27.0",
    "opentelemetry-sdk>=1.27.0",
    "opentelemetry-exporter-otlp-proto-http>=1.27.0",
    "opentelemetry-instrumentation-fastapi>=0.48b0",
    # Backport typing.override (PEP 698) dla Pythona 3.11; od 3.12 jest w stdlib.
    "typing-extensions>=4.12.0 ; python_version < '3.12'",
]

[project.optional-dependencies]
# Współdzielony licznik budżetu tokenów. Bez tego extra serwis działa na liczniku
# w pamięci procesu i musi chodzić na jednym workerze — patrz README.
redis = [
    "redis>=5.0.0",
]
dev = [
    "fakeredis>=2.23.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "pip-audit>=2.7.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
strict = true
mypy_path = "src"
packages = ["barometr_ai"]
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["fastembed.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    # AGENTS.md §3.1 wymaga, by testy jednostkowe były bez zewnętrznych zależności. Testy
    # jakościowe potrzebują jednak realnego modelu, którego nie da się podmienić atrapą bez
    # utraty sensu asercji. Marker je wydziela: `pytest -m \"not model\"` przechodzi offline.
    "model: wymaga pobrania realnego modelu embeddingów (sieć przy zimnym cache).",
]
